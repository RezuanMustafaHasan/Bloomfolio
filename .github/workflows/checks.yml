name: Build and market-data tests
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/market-data/requirements.txt
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/admin
      - run: npm run build
      - run: python -m pip install -r services/market-data/requirements.txt
      - run: python -m unittest discover -s services/market-data/tests
